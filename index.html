<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 分享預覽圖＋不讓 Google 收錄 -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="七個品牌・一條心｜佑達醫療集團尾牙報名，約 5 分鐘完成。">
<meta property="og:type" content="website">
<meta property="og:title" content="佑達醫療集團 尾牙報名">
<meta property="og:description" content="七個品牌・一條心｜頂粵吉品，攜伴、帶孩子都歡迎，約 5 分鐘完成報名。">
<meta property="og:url" content="https://tolaijin1234-maker.github.io/yuta/">
<meta property="og:image" content="https://tolaijin1234-maker.github.io/yuta/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>佑達醫療集團 尾牙報名</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   設定區：之後要改的東西都在 <script> 最上面的 CONFIG
   ========================================================= */
:root{
  --paper:#F3EEE6;
  --paper-2:#EAE3D8;
  --ink:#1D1A17;
  --ink-2:#6B635A;
  --line:#D5CCBF;
  --accent:#9C7A4A;          /* 選了品牌後會換成該品牌色 */
  --ease:cubic-bezier(.22,.7,.18,1);
  --serif:"Noto Serif TC",serif;
  --sans:"Noto Sans TC",system-ui,sans-serif;
  --latin:"Cormorant Garamond",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}

/* ---------- 共用 ---------- */
.view{position:fixed;inset:0;display:none}
.view.on{display:flex}
.eyebrow{font-family:var(--latin);font-style:italic;font-size:15px;letter-spacing:.06em;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:14px;padding:16px 28px;border:1px solid var(--ink);
  border-radius:999px;font-size:15px;letter-spacing:.12em;transition:background .35s var(--ease),color .35s var(--ease)}
.btn:hover,.btn:focus-visible{background:var(--ink);color:var(--paper);outline:none}
.btn .arr{transition:transform .35s var(--ease)}
.btn:hover .arr{transform:translateX(4px)}

/* ---------- 開場 ---------- */
#intro{flex-direction:row}
.intro-l{flex:1 1 52%;display:flex;flex-direction:column;justify-content:space-between;padding:56px 64px}
.intro-l h1{font-family:var(--serif);font-weight:600;font-size:clamp(44px,6.2vw,92px);line-height:1.08;letter-spacing:.04em;margin:28px 0 8px}
.intro-l h1 .h1-sub{display:flex;align-items:center;gap:18px;font-size:.36em;font-weight:400;letter-spacing:.42em;margin-top:22px;color:var(--accent)}
.intro-l h1 .h1-sub::before{content:"";width:48px;height:1px;background:currentColor}
.intro-l h1 small{display:block;font-family:var(--latin);font-weight:400;font-style:italic;font-size:.36em;letter-spacing:.04em;color:var(--ink-2);margin-top:14px}
.facts{display:grid;grid-template-columns:repeat(3,auto);gap:0 48px;margin:40px 0 48px;border-top:1px solid var(--line);padding-top:22px;max-width:560px}
.facts dt{font-family:var(--latin);font-style:italic;color:var(--ink-2);font-size:15px}
.facts dd{font-family:var(--serif);font-size:20px;margin-top:4px}
.vlink{color:inherit;text-decoration:none;border-bottom:1px dotted currentColor;transition:border-color .3s}
.vlink:hover{border-bottom-style:solid}
.vaddr{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.04em;margin-top:6px;line-height:1.6}
.vaddr a{color:var(--ink-2);text-decoration:none;border-bottom:1px dotted var(--line)}
.vaddr a:hover{color:var(--ink);border-bottom-color:var(--ink)}
.intro-r{flex:1 1 48%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
  position:relative;overflow:hidden;padding:40px;border-left:1px solid var(--line)}
.rings-box{position:relative;width:min(540px,88%);aspect-ratio:1}
.rings{width:100%;height:100%;display:block;overflow:visible}
.ring{transform-origin:300px 300px;animation:spin var(--d) linear infinite;animation-direction:var(--dir)}
.ring .arc{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-dashoffset:var(--len);
  animation:draw 1.8s var(--ease) forwards;animation-delay:var(--dl)}
.ring .dot{opacity:0;animation:fadein .6s ease forwards;animation-delay:calc(var(--dl) + 1.2s)}
.rings .base{fill:none;stroke:var(--line);stroke-width:.6}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
.rings-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  opacity:0;animation:fadein 1s ease 1.4s forwards}
.rings-center b{font-family:var(--latin);font-weight:400;font-style:italic;font-size:clamp(22px,2.4vw,34px);letter-spacing:.04em}
.rings-center span{font-family:var(--serif);font-size:13px;letter-spacing:.36em;color:var(--ink-2);margin-top:8px}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;max-width:520px;opacity:0;animation:fadein 1s ease 1.8s forwards}
.legend span{font-size:12px;letter-spacing:.14em;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.legend i{width:7px;height:7px;border-radius:50%;display:inline-block}

/* ---------- 表單 ---------- */
#form{flex-direction:row}
/* 左側問答背景疊圖：把場地照片存成 venue-bg.jpg 放在 index.html 旁邊即可；沒有圖片時不影響畫面 */
.pane-l{flex:1 1 55%;display:flex;flex-direction:column;padding:40px 64px 40px;position:relative;min-width:0}
/* 場地照片疊圖（首頁左側＋問答區）：要更明顯就調高 opacity，更淡就調低 */
.pane-l,.intro-l{isolation:isolate;overflow:hidden;position:relative}
.pane-l::before,.intro-l::before{content:"";position:absolute;inset:0;z-index:-2;background:url("venue-bg.jpg") center/cover no-repeat;
  opacity:.32;filter:grayscale(.2) sepia(.18);transform:scale(1.04);animation:bgdrift 40s ease-in-out infinite alternate}
.pane-l::after,.intro-l::after{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(100deg,rgba(243,238,230,.94) 0%,rgba(243,238,230,.78) 40%,rgba(243,238,230,.42) 72%,rgba(243,238,230,.18) 100%)}
@keyframes bgdrift{to{transform:scale(1.1) translateX(-1.5%)}}
.topbar{display:flex;justify-content:space-between;align-items:center}
.mark{font-family:var(--serif);font-size:14px;letter-spacing:.24em}
.mark i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:10px;vertical-align:1px;transition:background .6s}
.back{font-size:13px;letter-spacing:.14em;color:var(--ink-2);display:flex;gap:8px;align-items:center;opacity:1;transition:opacity .3s}
.back[disabled]{opacity:0;pointer-events:none}
.stage{flex:1;display:flex;align-items:center;position:relative}
.q{width:100%;max-width:620px}
.q.out{animation:qout .38s var(--ease) forwards}
.q.in{animation:qin .6s var(--ease) both}
@keyframes qout{to{opacity:0;transform:translateY(-28px)}}
@keyframes qin{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
.q-meta{display:flex;align-items:baseline;gap:16px;margin-bottom:22px}
.q-num{font-family:var(--latin);font-size:22px;color:var(--accent);transition:color .6s}
.q-sec{font-size:13px;letter-spacing:.2em;color:var(--ink-2)}
.q-title{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.1vw,40px);line-height:1.35;letter-spacing:.03em}
.q-title em{font-style:normal;color:var(--accent)}
.q-hint{margin-top:12px;color:var(--ink-2);font-size:14px;line-height:1.7}
.opts{margin-top:34px;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.opt{display:flex;align-items:center;gap:18px;padding:17px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:18px;
  position:relative;overflow:hidden;transition:padding .35s var(--ease)}
.opt::before{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleY(0);transform-origin:bottom;transition:transform .35s var(--ease);z-index:0}
.opt>*{position:relative;z-index:1}
.opt .k{font-family:var(--latin);font-size:15px;width:24px;height:24px;border:1px solid currentColor;border-radius:50%;
  display:grid;place-items:center;color:var(--ink-2);flex:none}
.opt .t{flex:1}
.opt .go{opacity:0;transform:translateX(-8px);transition:.35s var(--ease)}
.opt:hover,.opt:focus-visible{padding-left:14px;outline:none}
.opt:hover .go,.opt:focus-visible .go{opacity:1;transform:none}
.opt.sel{color:var(--paper)}
.opt.sel::before{transform:scaleY(1)}
.opt.sel .k{color:var(--paper)}
.opts.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
.field{margin-top:38px;display:flex;align-items:flex-end;gap:20px;border-bottom:1px solid var(--ink);padding-bottom:10px}
.field input{flex:1;border:0;background:transparent;font-family:var(--serif);font-size:26px;padding:6px 0;outline:none;min-width:0}
.field input::placeholder{color:#B9AFA2}
.err{color:#A2412F;font-size:13px;margin-top:12px;min-height:18px;letter-spacing:.04em}
.actions{margin-top:26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ok{padding:12px 22px;background:var(--ink);color:var(--paper);border-radius:999px;font-size:14px;letter-spacing:.14em}
.skip{font-size:14px;color:var(--ink-2);letter-spacing:.1em;text-decoration:underline;text-underline-offset:4px}
.enter{font-size:12px;color:var(--ink-2);letter-spacing:.1em}
.bar{height:2px;background:var(--line);margin-top:20px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);transition:width .7s var(--ease),background .6s}

/* 確認頁 */
.review{width:100%;max-width:620px}
.review h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.2vw,42px);letter-spacing:.04em;margin:10px 0 26px}
.rv{display:grid;grid-template-columns:120px 1fr;border-top:1px solid var(--line);max-height:46vh;overflow:auto}
.rv div{padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.rv .l{color:var(--ink-2);font-size:13px;letter-spacing:.12em;padding-top:13px}
.rv button{color:var(--accent);font-size:12px;margin-left:10px;letter-spacing:.1em}

/* ---------- 右側格子 ---------- */
.pane-r{flex:1 1 45%;background:var(--paper-2);display:flex;flex-direction:column;padding:40px 44px;min-width:0;border-left:1px solid var(--line)}
.card-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
.card-head h3{font-family:var(--serif);font-weight:400;font-size:20px;letter-spacing:.2em}
.card-head .cnt{font-family:var(--latin);font-size:18px;color:var(--ink-2)}
.tiles{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:8px;min-height:0}
.tile{position:relative;border:1px solid var(--line);overflow:hidden;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;
  transition:border-color .4s,opacity .5s,transform .6s var(--ease);opacity:.55}
.tile .n{font-family:var(--latin);font-size:14px;color:var(--ink-2);position:relative;z-index:1;transition:color .4s}
.tile .lb{font-size:12px;letter-spacing:.16em;color:var(--ink-2);position:relative;z-index:1;transition:color .4s}
.tile .v{font-family:var(--serif);font-size:clamp(14px,1.3vw,18px);line-height:1.3;position:relative;z-index:1;color:#fff;
  opacity:0;transform:translateY(10px);transition:.5s var(--ease) .25s;word-break:break-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0;background:var(--c,#333);
  background:color-mix(in srgb,var(--c,#333) 20%,transparent);clip-path:inset(100% 0 0 0);transition:clip-path .7s var(--ease)}
.tile.cur{opacity:1;border-color:var(--ink);transform:translateY(-2px)}
.tile.cur::after{content:"";position:absolute;left:14px;right:14px;bottom:10px;height:1px;background:var(--ink);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.15}}
.tile.done{opacity:1;border-color:color-mix(in srgb,var(--c) 30%,transparent)}
.tile.done::before{clip-path:inset(0 0 0 0)}
.tile.done .n{color:var(--c)}
.tile.done .lb{color:var(--ink-2)}
.tile.done .v{opacity:1;transform:none;color:var(--ink)}
.tile.empty .v{color:var(--ink-2)}
.card-foot{margin-top:18px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.14em;color:var(--ink-2)}

/* ---------- 完成 ---------- */
#thanks{align-items:center;justify-content:center;padding:40px;gap:72px;perspective:1400px}
.thx-text{max-width:460px}
#thanks h2{font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.6vw,48px);letter-spacing:.05em;margin:14px 0 14px;line-height:1.3}
#thanks p{color:var(--ink-2);line-height:1.9}

/* 邀請函卡片 */
.invite{--gold:#A8875A;position:relative;width:min(420px,88vw);background:#FBF8F2;color:var(--ink);
  padding:38px 36px 0;box-shadow:0 30px 60px -20px rgba(60,45,25,.35),0 2px 6px rgba(60,45,25,.08);
  transform:rotate(-3deg);transform-style:preserve-3d;transition:transform .5s var(--ease);
  animation:deal 1.1s var(--ease) backwards}
@keyframes deal{from{opacity:0;transform:translateY(80px) rotate(-12deg)}to{opacity:1;transform:rotate(-3deg)}}
.invite::before{content:"";position:absolute;inset:10px;border:1px solid var(--gold);pointer-events:none}
.invite::after{content:"";position:absolute;inset:14px;border:.5px solid color-mix(in srgb,var(--gold) 50%,transparent);pointer-events:none}
.iv-top{text-align:center}
.iv-top .eyebrow{color:var(--gold);letter-spacing:.3em;font-size:13px}
.iv-top h4{font-family:var(--serif);font-weight:400;font-size:15px;letter-spacing:.3em;margin-top:8px}
.iv-rule{display:flex;align-items:center;gap:10px;margin:18px auto;width:70%;color:var(--gold)}
.iv-rule::before,.iv-rule::after{content:"";flex:1;height:1px;background:currentColor}
.iv-to{text-align:center;font-size:12px;letter-spacing:.3em;color:var(--ink-2)}
.iv-name{text-align:center;font-family:var(--serif);font-size:clamp(28px,3vw,38px);letter-spacing:.12em;margin:6px 0 4px}
.iv-org{text-align:center;font-size:13px;letter-spacing:.16em;color:var(--ink-2)}
.iv-grid{display:grid;grid-template-columns:repeat(3,1fr);margin:26px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.iv-grid div{padding:12px 4px;text-align:center}
.iv-grid div+div{border-left:1px solid var(--line)}
.iv-grid dt{font-family:var(--latin);font-style:italic;font-size:13px;color:var(--gold)}
.iv-grid dd{font-family:var(--serif);font-size:15px;margin-top:2px}
.iv-meta{display:flex;justify-content:space-between;gap:12px;font-size:12px;letter-spacing:.1em;color:var(--ink-2);padding:14px 0 22px;line-height:1.7}
.iv-meta b{font-weight:500;color:var(--ink)}
.iv-stub{position:relative;margin:0 -36px;padding:16px 36px 22px;border-top:1.5px dashed var(--line);
  display:flex;justify-content:space-between;align-items:center}
.iv-stub::before,.iv-stub::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--paper)}
.iv-stub::before{left:-10px}.iv-stub::after{right:-10px}
.iv-admit{font-family:var(--latin);font-size:22px;letter-spacing:.12em}
.iv-admit small{font-family:var(--sans);font-size:11px;letter-spacing:.14em;color:var(--ink-2);margin-left:6px}
.iv-colors{display:flex;height:6px;width:120px}
.iv-colors i{flex:1}

/* ---------- 手機 ---------- */
@media (max-width:860px){
  body{overflow:auto}
  .view{position:relative;min-height:100vh;min-height:100dvh}
  #intro{flex-direction:column}
  .intro-l{padding:32px 24px 20px;flex:none}
  .facts{gap:0 22px;margin:26px 0 30px}
  .facts dd{font-size:17px}
  .intro-r{flex:none;border-left:0;border-top:1px solid var(--line);padding:30px 20px 40px;gap:22px}
  .rings-box{width:min(300px,80vw)}
  #thanks{flex-direction:column;justify-content:flex-start;gap:40px;padding:64px 20px 48px;text-align:center}
  .iv-meta{flex-direction:column;align-items:center;text-align:center;gap:2px}
  .invite{padding:32px 26px 0}.iv-stub{margin:0 -26px;padding:14px 26px 20px}
  .tile::before{background:color-mix(in srgb,var(--c,#333) 45%,transparent)}
  #form{flex-direction:column-reverse;justify-content:flex-end}
  .pane-l{padding:20px 22px 32px;flex:1}
  .pane-r{flex:none;padding:14px 22px 10px;border-left:0;border-bottom:1px solid var(--line)}
  .card-head{margin-bottom:10px}.card-head h3{font-size:14px}.card-head .cnt{font-size:15px}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(16px,1fr));grid-auto-rows:16px;gap:4px;flex:none}
  .tile{padding:0}.tile .n,.tile .lb,.tile .v{display:none}
  .tile.cur::after{left:3px;right:3px;bottom:3px}
  .card-foot{display:none}
  .stage{align-items:flex-start;padding-top:28px}
  .opts.grid{grid-template-columns:1fr}
  .opt{font-size:17px;padding:15px 2px}
  .field input{font-size:22px}
  .enter{display:none}
  .rv{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- 開場 -->
<section id="intro" class="view on">
  <div class="intro-l">
    <div class="eyebrow">Yuta Medical Group · Year-End Party</div>
    <div>
      <h1>佑達醫療集團<span class="h1-sub">尾牙報名</span><small>An evening to say thank you.</small></h1>
      <dl class="facts">
        <div><dt>Date</dt><dd id="f-date"></dd></div>
        <div><dt>Time</dt><dd id="f-time"></dd></div>
        <div><dt>Venue</dt><dd id="f-venue"></dd></div>
      </dl>
      <button class="btn" id="start">開始填寫 <span class="arr">→</span></button>
      <p class="q-hint" style="margin-top:18px;font-family:var(--latin);font-style:italic;font-size:16px;letter-spacing:.03em">About 5 minutes · Thank you for taking the time.</p>
    </div>
    <div class="eyebrow" id="deadline"></div>
  </div>
  <div class="intro-r">
    <div class="rings-box">
      <svg class="rings" id="rings" viewBox="0 0 600 600" aria-hidden="true"></svg>
      <div class="rings-center"><b>7 Brands, One Heart</b><span>七個品牌・一條心</span></div>
    </div>
    <div class="legend" id="legend"></div>
  </div>
</section>

<!-- 表單 -->
<section id="form" class="view">
  <div class="pane-l">
    <div class="topbar">
      <div class="mark"><i></i>佑達醫療集團 尾牙</div>
      <button class="back" id="back" disabled>← 上一題</button>
    </div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="stage" id="stage"></div>
  </div>
  <aside class="pane-r">
    <div class="card-head"><h3>賓客卡</h3><span class="cnt" id="cnt">00 / 00</span></div>
    <div class="tiles" id="tiles"></div>
    <div class="card-foot"><span>GUEST CARD</span><span id="foot-brand">—</span></div>
  </aside>
</section>

<!-- 完成 -->
<section id="thanks" class="view">
  <div class="invite" id="invite"></div>
  <div class="thx-text">
    <div class="eyebrow">Thank you</div>
    <h2 id="thanks-title">報名完成</h2>
    <p id="thanks-msg"></p>
    <button class="btn" id="restart" style="margin-top:32px">回到首頁 <span class="arr">↺</span></button>
  </div>
</section>

<script>
/* =========================================================
   CONFIG：這裡改日期、地點、品牌、店名、收資料網址
   ========================================================= */
const CONFIG = {
  date: '暫定', time: '暫定',
  venue: '頂粵吉品',
  address: '台中市西屯區市政南一路288號',
  venueUrl: 'https://www.dyjipin.com.tw/',
  deadline: '',                     // 例如 '請於 12/15 前填寫'
  // 部署 Google Apps Script 後，把網址貼在這裡；留空 = 測試模式（不會真的送出）
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbzbEp3miK14WxzwCu_YEHG3rPKl3fI5tc5rykryjKPd6n0fUHpTWUGgF05c2shTY9Pe/exec',
  BRANDS: [
    { name:'佑達泌尿科', short:'佑達',   color:'#605549', stores:['台中南屯','台中北屯','台中西屯水湳','新竹東區','新竹竹北'] },
    { name:'涵恩婦產科', short:'涵恩',   color:'#A65D73', stores:['台中北屯','新竹竹北'] },
    { name:'陪你長大小兒科', short:'陪你長大', color:'#9DAE7F', stores:['新竹竹北','台中北屯'] },
    { name:'樂樂耳鼻喉科', short:'樂樂', color:'#D9893E', stores:['台中北屯'] },
    { name:'妍回美學診所', short:'妍回', color:'#8A6E4B', stores:['台中南屯','台中北屯','新竹竹北'] },
    { name:'青心診所', short:'青心',     color:'#3D7A66', stores:['新竹竹北','台中北屯'] },
    { name:'康雲診所', short:'康雲',     color:'#A8844F', stores:['台中南屯'] },
  ]
};

const DIET = ['葷食','全素','蛋奶素','鍋邊素','其他'];

/* 題目：show(a) 決定這題要不要出現（分支） */
const STEPS = [
  { id:'attend', sec:'出席意願', label:'出席', q:'今年尾牙，<em>你會來嗎？</em>', type:'choice',
    opts:['會，我會出席','不克出席'], req:true },

  { id:'companion', sec:'攜伴', label:'攜伴', q:'會攜伴一起來嗎？', type:'choice',
    opts:['不攜伴','會攜伴'], req:true, show:a=>attending(a) },
  { id:'companion_count', sec:'攜伴', label:'攜伴人數', q:'攜伴人數？', type:'choice',
    opts:['1 位','2 位','3 位'], req:true, show:a=>withCompanion(a) },
  { id:'companion_diet', sec:'攜伴', label:'攜伴飲食', q:'攜伴者的飲食習慣？', hint:'多位且飲食不同，請在之後的「過敏或忌口」欄補充。',
    type:'choice', opts:DIET, grid:true, req:true, show:a=>withCompanion(a) },
  { id:'kids', sec:'攜伴', label:'孩童', q:'有攜帶孩童嗎？', type:'choice',
    opts:['沒有','1 位','2 位','3 位以上'], req:true, show:a=>withCompanion(a) },
  { id:'kid_seat', sec:'攜伴', label:'兒童座椅', q:'需要兒童座椅嗎？', type:'choice',
    opts:['不需要','1 張','2 張','3 張以上'], req:true, show:a=>withCompanion(a) && a.kids && a.kids!=='沒有' },

  { id:'name', sec:'基本資料', label:'姓名', q:'怎麼稱呼你？', hint:'姓名或綽號都可以，方便我們安排座位與名牌。',
    type:'text', ph:'例如：阿宏', req:true },
  { id:'brand', sec:'基本資料', label:'品牌', q:'你所屬的品牌是？', type:'choice', grid:true,
    opts:()=>CONFIG.BRANDS.map(b=>b.name), req:true },
  { id:'store', sec:'基本資料', label:'院所', q:a=>`<em>${a.brand}</em>，哪一間院所？`, type:'choice',
    opts:a=>(CONFIG.BRANDS.find(b=>b.name===a.brand)||{stores:[]}).stores, req:true },
  { id:'email', sec:'基本資料', label:'Email', q:'你的 Email？', hint:'活動通知與異動會寄到這裡。',
    type:'email', ph:'name@example.com', req:true },
  { id:'phone', sec:'基本資料', label:'院所電話', q:'聯絡電話', hint:'請填院所電話，我會打去院所找您。',
    type:'tel', ph:'例如：04-2380-2393', req:true },

  { id:'diet', sec:'餐飲需求', label:'飲食', q:'你的飲食習慣？', type:'choice', grid:true,
    opts:DIET, req:true, show:a=>attending(a) },
  { id:'allergy', sec:'餐飲需求', label:'過敏忌口', q:'有食物過敏或忌口嗎？', hint:'例如：海鮮、花生、不吃牛。沒有可直接跳過。',
    type:'text', ph:'沒有可跳過', req:false, show:a=>attending(a) },
  { id:'alcohol', sec:'餐飲需求', label:'飲酒', q:'當天會喝酒嗎？', hint:'選填，用來估算酒水量。',
    type:'choice', opts:['會','不會'], req:false, show:a=>attending(a) },
];

function attending(a){ return a.attend === '會，我會出席'; }
function withCompanion(a){ return attending(a) && a.companion === '會攜伴'; }

/* ========================================================= */
const $ = s => document.querySelector(s);
const A = {};             // 作答
let cur = 0;              // 目前在 visible 清單中的位置
let busy = false;

const visible = () => STEPS.filter(s => !s.show || s.show(A));
const resolve = (v) => typeof v === 'function' ? v(A) : v;
const pad = n => String(n).padStart(2,'0');

/* 開場 */
$('#f-date').textContent = CONFIG.date;
$('#f-time').textContent = CONFIG.time;
/* 場地：店名連到餐廳官網，地址連到 Google 地圖 */
const MAP_URL = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(CONFIG.venue + ' ' + (CONFIG.address||''));
const venueHtml = () =>
  (CONFIG.venueUrl ? `<a class="vlink" href="${CONFIG.venueUrl}" target="_blank" rel="noopener">${esc(CONFIG.venue)}</a>` : esc(CONFIG.venue))
  + (CONFIG.address ? `<span class="vaddr"><a href="${MAP_URL}" target="_blank" rel="noopener">${esc(CONFIG.address)}</a></span>` : '');
$('#f-venue').innerHTML = venueHtml();
$('#deadline').textContent = CONFIG.deadline || 'Please RSVP';
/* 七色圓環：每圈一個品牌，弧長、轉速、方向各不同 */
(function drawRings(){
  const arcs = [.72,.58,.80,.46,.66,.54,.76];
  $('#rings').innerHTML = CONFIG.BRANDS.map((b,i)=>{
    const r = 118 + i*26, C = 2*Math.PI*r, L = C*arcs[i % arcs.length];
    const ang = (i*137) % 360, rad = ang*Math.PI/180;
    const dx = 300 + r*Math.cos(rad), dy = 300 + r*Math.sin(rad);
    return `<circle class="base" cx="300" cy="300" r="${r}"/>
      <g class="ring" style="--d:${40+i*9}s;--dir:${i%2?'reverse':'normal'}">
        <circle class="arc" cx="300" cy="300" r="${r}" stroke="${b.color}"
          stroke-dasharray="${L.toFixed(1)} ${C.toFixed(1)}" transform="rotate(${ang} 300 300)"
          style="--len:${L.toFixed(1)};--dl:${(.12*i).toFixed(2)}s"/>
        <circle class="dot" cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="4" fill="${b.color}" style="--dl:${(.12*i).toFixed(2)}s"/>
      </g>`;
  }).join('');
  $('#legend').innerHTML = CONFIG.BRANDS.map(b=>`<span><i style="background:${b.color}"></i>${b.name}</span>`).join('');
})();
$('#start').onclick = () => { show('form'); render(true); };

function show(id){ document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on', v.id===id)); }

/* 品牌色 */
function setAccent(){
  const b = CONFIG.BRANDS.find(x=>x.name===A.brand);
  document.documentElement.style.setProperty('--accent', b ? b.color : '#9C7A4A');
  $('#foot-brand').textContent = b ? `${b.name}${A.store ? ' · '+A.store : ''}` : '—';
}
function tileColor(i){
  const b = CONFIG.BRANDS.find(x=>x.name===A.brand);
  return b ? b.color : CONFIG.BRANDS[i % CONFIG.BRANDS.length].color;
}

/* 右側格子 */
function renderTiles(reviewing){
  const vs = visible();
  const done = vs.filter(s => s.id in A).length;
  $('#cnt').textContent = `${pad(Math.min(done, vs.length))} / ${pad(vs.length)}`;
  $('#tiles').innerHTML = vs.map((s,i)=>{
    const has = s.id in A;
    const val = has ? (A[s.id] || '—') : '';
    const cls = ['tile', has ? 'done' : '', (!reviewing && i===cur) ? 'cur' : '', has && !A[s.id] ? 'empty':''].join(' ');
    return `<div class="${cls}" style="--c:${tileColor(i)}" title="${s.label}">
      <span class="n">${pad(i+1)}</span>
      <div><div class="lb">${s.label}</div><div class="v">${esc(val)}</div></div></div>`;
  }).join('');
  $('#barfill').style.width = (reviewing ? 100 : (cur / vs.length) * 100) + '%';
}

/* 左側題目 */
function render(first){
  const vs = visible();
  if (cur >= vs.length) return renderReview();
  const s = vs[cur];
  const q = resolve(s.q);
  let body = '';
  if (s.type === 'choice'){
    const opts = resolve(s.opts);
    body = `<div class="opts ${s.grid?'grid':''}">` + opts.map((o,i)=>
      `<button class="opt ${A[s.id]===o?'sel':''}" data-v="${esc(o)}"><span class="k">${String.fromCharCode(65+i)}</span><span class="t">${esc(o)}</span><span class="go">→</span></button>`
    ).join('') + `</div>`;
    if (!s.req) body += `<div class="actions"><button class="skip" data-skip>跳過</button></div>`;
  } else {
    body = `<div class="field"><input id="inp" type="${s.type==='tel'?'tel':s.type==='email'?'email':'text'}"
      placeholder="${s.ph||''}" value="${esc(A[s.id]||'')}" autocomplete="${s.type==='email'?'email':s.type==='tel'?'tel':'name'}"></div>
      <div class="err" id="err"></div>
      <div class="actions"><button class="ok" data-ok>確定 ✓</button>
      ${!s.req?'<button class="skip" data-skip>跳過</button>':''}<span class="enter">或按 Enter ↵</span></div>`;
  }
  const html = `<div class="q in">
      <div class="q-meta"><span class="q-num">${pad(cur+1)}</span><span class="q-sec">${s.sec}</span></div>
      <h2 class="q-title">${q}</h2>${s.hint?`<p class="q-hint">${s.hint}</p>`:''}${body}</div>`;
  swap(html, first);
  $('#back').disabled = cur === 0;
  renderTiles(false);
}

function swap(html, first){
  const stage = $('#stage');
  const old = stage.firstElementChild;
  const put = () => { stage.innerHTML = html; bind(); busy = false; };
  if (old && !first){ old.classList.add('out'); setTimeout(put, 360); } else put();
}

function bind(){
  const s = visible()[cur];
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(b));
  const skip = document.querySelector('[data-skip]');
  if (skip) skip.onclick = () => answer(s, '');
  const ok = document.querySelector('[data-ok]');
  const inp = $('#inp');
  if (inp){
    setTimeout(()=>inp.focus({preventScroll:true}), 80);
    const submit = () => {
      const v = inp.value.trim();
      if (s.req && !v) return err('這題必填喔');
      if (s.type==='email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return err('Email 格式看起來不太對');
      if (s.type==='tel' && (v.match(/\d/g)||[]).length < 7) return err('電話號碼看起來不完整');
      answer(s, v);
    };
    ok.onclick = submit;
    inp.onkeydown = e => { if (e.key==='Enter' && !e.isComposing){ e.preventDefault(); submit(); } };
  }
}
function err(m){ const e=$('#err'); e.textContent=m; $('#inp').focus(); }

function pick(btn){
  if (busy) return;
  const s = visible()[cur];
  document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  busy = true;
  setTimeout(()=>{ busy=false; answer(s, btn.dataset.v); }, 320);
}

function answer(s, v){
  if (busy) return; busy = true;
  const changed = A[s.id] !== v;
  A[s.id] = v;
  if (s.id==='brand' && changed) delete A.store;           // 換品牌就重選院所
  // 移除因分支而不再出現的答案
  const ids = new Set(visible().map(x=>x.id));
  Object.keys(A).forEach(k => { if (!ids.has(k)) delete A[k]; });
  setAccent();
  // 如果是從確認頁回來修改，改完直接回確認頁
  if (returnToReview){
    const vs = visible(), next = vs.findIndex(x => !(x.id in A));   // 改答案後若冒出新題目，先補答
    if (next === -1){ returnToReview=false; cur = vs.length; } else cur = next;
  } else cur++;
  renderTiles(false);
  render();
}

$('#back').onclick = () => { if (cur>0 && !busy){ busy=true; cur--; render(); } };

/* 鍵盤：A/B/C 選項 */
document.addEventListener('keydown', e=>{
  if (!$('#form').classList.contains('on') || e.target.tagName==='INPUT') return;
  const i = e.key.toUpperCase().charCodeAt(0) - 65;
  const opts = document.querySelectorAll('.opt');
  if (e.key.length===1 && i>=0 && i<opts.length) pick(opts[i]);
});

/* 確認頁 */
let returnToReview = false;
function renderReview(){
  const vs = visible();
  const rows = vs.map((s,i)=>`<div class="l">${s.label}</div>
    <div>${esc(A[s.id]||'—')}<button data-edit="${i}">修改</button></div>`).join('');
  const html = `<div class="review q in">
    <div class="q-meta"><span class="q-num">✓</span><span class="q-sec">最後確認</span></div>
    <h2>${esc(A.name||'')}，資料都正確嗎？</h2>
    <div class="rv">${rows}</div>
    <div class="err" id="err"></div>
    <div class="actions"><button class="btn" id="send">送出報名 <span class="arr">→</span></button></div></div>`;
  swap(html);
  setTimeout(()=>{
    document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{ returnToReview=true; cur=+b.dataset.edit; render(); });
    $('#send').onclick = send;
  }, 380);
  $('#back').disabled = false;
  renderTiles(true);
}

async function send(){
  const btn = $('#send'); btn.disabled = true; btn.innerHTML = '送出中…';
  const payload = { submitted_at: new Date().toISOString() };
  STEPS.forEach(s => payload[s.id] = A[s.id] || '');
  try{
    if (CONFIG.SCRIPT_URL){
      await fetch(CONFIG.SCRIPT_URL, { method:'POST', mode:'no-cors', body: JSON.stringify(payload) });
    } else {
      console.log('[測試模式] 尚未設定 SCRIPT_URL，以下資料不會送出：', payload);
      await new Promise(r=>setTimeout(r,600));
    }
    thanks();
  }catch(e){
    btn.disabled = false; btn.innerHTML = '再試一次 <span class="arr">→</span>';
    $('#err').textContent = '送出失敗，請檢查網路後再試一次。';
  }
}

function num(s){ const m = String(s||'').match(/\d+/); return m ? +m[0] : 0; }
function buildInvite(){
  const going = attending(A);
  const party = going ? 1 + num(A.companion_count) + num(A.kids) : 0;
  const colors = CONFIG.BRANDS.map(b=>`<i style="background:${b.color}"></i>`).join('');
  const diet = [A.diet && `本人 <b>${esc(A.diet)}</b>`, A.companion_diet && `攜伴 <b>${esc(A.companion_diet)}</b>`].filter(Boolean).join('　');
  const extra = [num(A.companion_count) && `攜伴 ${num(A.companion_count)} 位`, num(A.kids) && `孩童 ${num(A.kids)} 位`,
                 num(A.kid_seat) && `兒童椅 ${num(A.kid_seat)} 張`].filter(Boolean).join('・');
  $('#invite').innerHTML = `
    <div class="iv-top"><div class="eyebrow">${going ? 'Invitation' : 'With Thanks'}</div><h4>佑達醫療集團 尾牙</h4></div>
    <div class="iv-rule">✦</div>
    <div class="iv-to">${going ? '誠 摯 邀 請' : '謝 謝 你 的 回 覆'}</div>
    <div class="iv-name">${esc(A.name||'')}</div>
    <div class="iv-org">${esc(A.brand||'')}${A.store ? '・'+esc(A.store) : ''}</div>
    <dl class="iv-grid">
      <div><dt>Date</dt><dd>${esc(CONFIG.date)}</dd></div>
      <div><dt>Time</dt><dd>${esc(CONFIG.time)}</dd></div>
      <div><dt>Venue</dt><dd>${venueHtml()}</dd></div>
    </dl>
    <div class="iv-meta"><span>${going ? (diet || '') : '這次不克出席'}</span><span>${going ? extra : '期待下次相聚'}</span></div>
    <div class="iv-stub">
      <div class="iv-admit">${going ? `Admit ${party}<small>位</small>` : 'See you next time'}</div>
      <div class="iv-colors">${colors}</div>
    </div>`;
}
/* 卡片隨滑鼠微微傾斜 */
document.addEventListener('mousemove', e=>{
  if (!matchMedia('(hover:hover)').matches) return;
  const card = $('#invite');
  if (!$('#thanks').classList.contains('on') || !card) return;
  const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
  card.style.transform = `rotate(-3deg) rotateY(${x*10}deg) rotateX(${-y*8}deg)`;
});

function thanks(){
  buildInvite();
  $('#thanks-title').textContent = attending(A) ? `${A.name}，到時見！` : '收到，謝謝你的回覆';
  $('#thanks-msg').innerHTML = attending(A)
    ? `已收到你的報名，邀請函確認信已寄到 ${esc(A.email)}。<br>幾分鐘內沒看到，請查看垃圾郵件匣。`
    : `很可惜這次不能一起，謝謝你撥空回覆。`;
  if (!CONFIG.SCRIPT_URL) $('#thanks-msg').innerHTML += '<br><small>（測試模式：資料未實際送出）</small>';
  show('thanks');
}

/* 回到首頁：清空所有答案重新開始 */
$('#restart').onclick = () => {
  Object.keys(A).forEach(k => delete A[k]);
  cur = 0; busy = false; returnToReview = false;
  $('#stage').innerHTML = '';
  setAccent();
  show('intro');
};

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
